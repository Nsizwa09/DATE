<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Question ✨</title>
  
  <!-- 1. EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function() {
      // REPLACE "YOUR_PUBLIC_KEY" with your actual EmailJS Public Key
      emailjs.init("HJDVaGeoLjFc-AUX9");
    })();
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #ffe6eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(255, 182, 193, 0.4);
      text-align: center;
      max-width: 420px;
      width: 90%;
      position: relative;
      z-index: 10;
    }

    .page {
      display: none;
      animation: fadeIn 0.5s ease-in-out forwards;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .heart-icon {
      font-size: 65px;
      margin-bottom: 20px;
      display: inline-block;
      animation: pulse 1.5s infinite;
    }

    .cute-bounce {
      display: inline-block;
      animation: cuteBounce 1.2s infinite ease-in-out alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    @keyframes cuteBounce {
      0% { transform: translateY(0) rotate(-4deg); }
      100% { transform: translateY(-12px) rotate(4deg); }
    }

    h1 {
      color: #ff4b72;
      font-size: 26px;
      margin-bottom: 24px;
      line-height: 1.3;
    }

    p {
      color: #666;
      font-size: 18px;
      line-height: 1.5;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      position: relative;
      min-height: 50px;
      margin-top: 20px;
    }

    button {
      background-color: #ff4b72;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      box-shadow: 0 4px 15px rgba(255, 75, 114, 0.3);
    }

    button:hover {
      background-color: #e03a5f;
      transform: scale(1.08);
    }

    #no-btn {
      background-color: #ff85a1;
    }

    #no-btn:hover {
      background-color: #e06c88;
    }

    /* Date and Time Inputs */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
      align-items: center;
    }

    .input-group label {
      font-size: 14px;
      color: #ff4b72;
      font-weight: bold;
      margin-bottom: -8px;
      text-align: left;
      width: 80%;
    }

    input[type="date"],
    input[type="time"] {
      width: 80%;
      padding: 12px 16px;
      border: 2px solid #ffccd5;
      border-radius: 12px;
      font-size: 16px;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="date"]:focus,
    input[type="time"]:focus {
      border-color: #ff4b72;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div class="container">
    <!-- Page 1: Landing Question -->
    <div id="page1" class="page active">
      <div class="heart-icon">💖</div>
      <h1>Will you go on a date with me?</h1>
      <div class="btn-container">
        <button onclick="triggerCelebration1('Yes')">Yes!</button>
        <button id="no-btn" onclick="triggerCelebration1('No')">No</button>
      </div>
    </div>

    <!-- Page 2: Celebration Screen 1 -->
    <div id="page2" class="page">
      <div class="heart-icon cute-bounce">🎉🥳✨</div>
      <h1>Yay! Best Decision Ever!</h1>
      <p>Get ready for something fun...</p>
    </div>

    <!-- Page 3: Food or Drinks Choice -->
    <div id="page3" class="page">
      <div class="heart-icon cute-bounce">🍹🍱</div>
      <h1>So... what are you in the mood for?</h1>
      <div class="btn-container">
        <button onclick="triggerCelebration2('Drinks 🍹')">Drinks 🍹</button>
        <button onclick="triggerCelebration2('Food 🍱')">Food 🍱</button>
      </div>
    </div>

    <!-- Page 4: Celebration Screen 2 -->
    <div id="page4" class="page">
      <div class="heart-icon cute-bounce">🥂✨💖</div>
      <h1>Awesome Pick!</h1>
      <p>Now let's pick the perfect time...</p>
    </div>

    <!-- Page 5: Date & Time Input -->
    <div id="page5" class="page">
      <div class="heart-icon cute-bounce">📅⏰💌</div>
      <h1>When are you free?</h1>
      <form onsubmit="submitDateTime(event)" class="input-group">
        <label for="date-input">Select Date:</label>
        <input type="date" id="date-input" required>
        
        <label for="time-input">Select Time:</label>
        <input type="time" id="time-input" required>
        
        <div class="btn-container">
          <button type="submit">Lock It In! 🔒</button>
        </div>
      </form>
    </div>

    <!-- Page 6: Final Message -->
    <div id="page6" class="page">
      <div class="heart-icon">🥰💌</div>
      <h1>It's a Date!</h1>
      <p id="final-message"></p>
    </div>
  </div>

  <script>
    const whatsappNumber = "27780122274";
    let firstChoice = '';
    let selectedPreference = '';

    function goToPage(pageNumber) {
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      document.getElementById(`page${pageNumber}`).classList.add('active');
    }

    function triggerCelebration1(choice) {
      firstChoice = choice;
      goToPage(2);
      startConfetti();

      setTimeout(() => {
        goToPage(3);
      }, 2500);
    }

    function triggerCelebration2(choice) {
      selectedPreference = choice;
      goToPage(4);
      startConfetti();

      setTimeout(() => {
        goToPage(5);
      }, 2500);
    }

    function submitDateTime(event) {
      event.preventDefault();
      const dateVal = document.getElementById('date-input').value;
      const timeVal = document.getElementById('time-input').value;

      goToPage(6);
      startConfetti();
      document.getElementById('final-message').innerText = `Can't wait for ${selectedPreference} with you on ${dateVal} at ${timeVal}! Redirecting to WhatsApp to send your responses... 😊`;

      // 2. Silent EmailJS delivery to zondolulama49@gmail.com
      const templateParams = {
        to_email: 'zondolulama49@gmail.com',
        first_choice: firstChoice,
        preference: selectedPreference,
        date: dateVal,
        time: timeVal
      };

      // REPLACE "YOUR_SERVICE_ID" and "YOUR_TEMPLATE_ID" with your EmailJS credentials
      emailjs.send('service_zd2wish', 'template_jhpcexd', templateParams)
        .catch(err => console.error('Silent email send failed:', err));

      // 3. Automated WhatsApp Redirection
      const message = `Hey! I filled out your date form 🥰\n\n` +
                      `• First Answer: ${firstChoice}\n` +
                      `• Preference: ${selectedPreference}\n` +
                      `• Date: ${dateVal}\n` +
                      `• Time: ${timeVal}`;

      const whatsappUrl = `https://api.whatsapp.com/send?phone=${whatsappNumber}&text=${encodeURIComponent(message)}`;

      setTimeout(() => {
        window.location.href = whatsappUrl;
      }, 1500);
    }

    // Canvas Confetti Effect
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function startConfetti() {
      particles = [];
      const colors = ['#ff4b72', '#ff85a1', '#ffd166', '#06d6a0', '#118ab2', '#ff9f1c'];
      for (let i = 0; i < 120; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.8) * 12,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 10
        });
      }
      animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let activeParticles = false;

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.rotation += p.rotSpeed;

        if (p.y < canvas.height) activeParticles = true;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      });

      if (activeParticles) {
        requestAnimationFrame(animateConfetti);
      }
    }
  </script>

</body>
</html>
